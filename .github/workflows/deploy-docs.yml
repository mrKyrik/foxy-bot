name: Deploy Docs Page

on:
  push:
    branches:
      - main
      - fresh-main
    paths:
      - 'web/docs/**'
      - '.github/workflows/deploy-docs.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./web/docs
        run: npm install

      - name: Build project
        working-directory: ./web/docs
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "web/docs/build"
          target: "/home/ubuntu/prc/foxy"
          overwrite: true
