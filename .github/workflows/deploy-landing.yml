name: Deploy Landing Page

on:
  push:
    branches:
      - main
      - fresh-main
    paths:
      - 'web/landing/**'
      - '.github/workflows/deploy-landing.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./web/landing
        run: npm install

      - name: Build project
        working-directory: ./web/landing
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "web/landing/dist"
          target: "/home/ubuntu/prc/foxy"
          overwrite: true
