# Kumiho - Yeni Nginx Yapılandırması (Faz 3)
# Bu dosyayı VPS'te /etc/nginx/sites-available/default (veya kumiho) olarak kaydetmelisin.

# 1. Ana Sayfa (Landing Page)
server {
    listen 80;
    server_name kyrik.duckdns.org foxy-bot.duckdns.org;

    location / {
        root /home/ubuntu/prc/foxy/web/landing/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# 2. Yönetim Paneli (Admin Panel)
server {
    listen 80;
    server_name admin-foxy.duckdns.org;

    location / {
        root /home/ubuntu/prc/foxy/web/dashboard/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. Dökümantasyon (Docs)
server {
    listen 80;
    server_name docs-foxy.duckdns.org;

    location / {
        root /home/ubuntu/prc/foxy/web/docs/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
